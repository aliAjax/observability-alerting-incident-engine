services:
  postgres:
    image: postgres:16-alpine
    container_name: observability-alerting-postgres
    environment:
      POSTGRES_DB: observability
      POSTGRES_USER: observability
      POSTGRES_PASSWORD: observability
    ports:
      - "55433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U observability -d observability"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - observability_pgdata:/var/lib/postgresql/data

volumes:
  observability_pgdata:
